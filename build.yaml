# Code generation scope. Every builder resolves each file it is allowed to run
# on, and screens/widgets pull in all of material_ui: limiting freezed and
# json_serializable to the folders that hold annotated classes cut a one-file
# rebuild from ~13-30 s to ~1 s in a generated app.
#
# Convention (flutter-architecture skill, fgen output):
#   - @freezed classes live in a `models/` folder (domain models, DTOs,
#     lib/core/models) or a `bloc/` folder (cubit/bloc states);
#   - @JsonSerializable / fromJson classes live in a `models/` folder.
# A @freezed class anywhere else gets NO generated part: the analyzer then
# reports "Target of URI doesn't exist: '<file>.freezed.dart'". Move the class
# into models/ or bloc/, or add its folder below, then re-run
# `dart run build_runner build --delete-conflicting-outputs`.
#
# Folders added for this app's pre-convention classes: sound/domain (the TTS
# queue item and engine status) and the stream_processor / llm chunks — their
# .g.dart is generated FROM the .freezed.dart output, so json_serializable
# needs those folders too.
targets:
  $default:
    builders:
      freezed:
        generate_for:
          - lib/**/models/**
          - lib/**/bloc/**
          - lib/core/services/stream_processor/**
          - lib/core/services/llm/**
          - lib/features/sound/domain/**
      json_serializable:
        generate_for:
          - lib/**/models/**
          - lib/core/services/stream_processor/**
          - lib/core/services/llm/**
          - lib/features/sound/domain/**
