plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "fr.yofardev"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "fr.yofardev"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    // sherpa_onnx (Kokoro TTS) bundles its own libonnxruntime.so, and
    // flutter_onnxruntime (Supertonic, the fallback voice) pulls another one
    // from Maven. Their exported symbols are version-tagged, so both sides
    // must load the same ONNX Runtime: sherpa_onnx is pinned to 1.13.3
    // (ORT 1.24.3) and the Maven artifact is forced to 1.24.3 below.
    packagingOptions {
        jniLibs {
            pickFirsts += ["**/libonnxruntime.so"]
        }
    }
}

configurations.configureEach {
    resolutionStrategy.force("com.microsoft.onnxruntime:onnxruntime-android:1.24.3")
}

flutter {
    source = "../.."
}
